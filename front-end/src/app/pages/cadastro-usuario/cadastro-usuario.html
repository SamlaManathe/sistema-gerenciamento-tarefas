<main class="auth-container">
  <section class="auth-card">
    <h1>Cadastro de usuária</h1>

    <p class="erro" *ngIf="erro">{{ erro }}</p>

    <form (ngSubmit)="cadastrar()" #form="ngForm">
      <label for="nome">Nome</label>
      <input id="nome" name="nome" [(ngModel)]="usuario.nome" required />

      <label for="email">E-mail</label>
      <input
        id="email"
        name="email"
        type="email"
        [(ngModel)]="usuario.email"
        required
        email
      />

      <label for="senha">Senha</label>
      <input
        id="senha"
        name="senha"
        type="password"
        [(ngModel)]="usuario.senha"
        required
        minlength="6"
        autocomplete="new-password"
      />

      <button type="submit" [disabled]="form.invalid || carregando">
        {{ carregando ? 'Cadastrando...' : 'Cadastrar' }}
      </button>
    </form>

    <p>Já tem uma conta? <a routerLink="/login">Entrar</a></p>
  </section>
</main>
